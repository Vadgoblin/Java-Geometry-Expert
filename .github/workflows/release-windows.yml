
name: Build JGEX for Windows

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install gettext and Inno Setup
        shell: pwsh
        run: |
          choco install gettext innosetup -y
          refreshenv

      - name: Verify build tools
        shell: pwsh
        run: |
          java -version
          msgfmt --version
          iscc /?

      - name: Build Windows installer
        shell: pwsh
        env:
          SOFTWARE_VERSION: ${{ github.ref_name }}
        run: |
          .\gradlew.bat package --no-daemon

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: jgex-windows
          path: |
            **/*.exe
            **/*.zip
          if-no-files-found: error
          retention-days: 14
